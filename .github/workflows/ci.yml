name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Hub's tests need a PostgreSQL server; they create and drop their own databases.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HEIMDALL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      # A fresh runner reads Chromium from a cold disk, so its first launch takes
      # 5 to 40 seconds before it loads a page (HMD-192). Launching it once in the
      # background here moves that cost off the DOM tests' clock.
      - name: Warm Chromium for the DOM tests
        run: >-
          chromium --headless --no-sandbox --disable-gpu --dump-dom
          --user-data-dir="$RUNNER_TEMP/chromium-warm" about:blank > /dev/null 2>&1 &
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compile the Collector binary
        run: |
          bun run build:collector
          ./dist/heimdall-collector --version | grep -E '^heimdall-collector v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \(Report schema v[0-9]+\)$'
      - name: Compile the dashboard binary
        run: |
          bun run build:dashboard
          ./dist/heimdall-dashboard --version | grep -E '^heimdall-dashboard v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \(Report schema v[0-9]+\)$'
