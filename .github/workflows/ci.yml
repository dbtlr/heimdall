name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compile the Collector binary
        run: |
          bun run build:collector
          ./dist/heimdall-collector --version | grep -E '^heimdall-collector [0-9]+\.[0-9]+\.[0-9]+ \(Report schema v[0-9]+\)$'
