name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Hub's tests need a PostgreSQL server; they create and drop their own databases.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HEIMDALL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compile the Collector binary
        run: |
          bun run build:collector
          ./dist/heimdall-collector --version | grep -E '^heimdall-collector [0-9]+\.[0-9]+\.[0-9]+ \(Report schema v[0-9]+\)$'
