name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Hub's tests need a PostgreSQL server; they create and drop their own databases.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      HEIMDALL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compile the Collector binary
        run: |
          bun run build:collector
          ./dist/heimdall-collector --version | grep -E '^heimdall-collector v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \(Report schema v[0-9]+\)$'
      - name: Compile the dashboard binary
        run: |
          bun run build:dashboard
          ./dist/heimdall-dashboard --version | grep -E '^heimdall-dashboard v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)? \(Report schema v[0-9]+\)$'
