name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Compile the Collector binary
        run: |
          bun run build:collector
          ./dist/heimdall-collector --version | grep -E '^heimdall-collector [0-9]+\.[0-9]+\.[0-9]+ \(Report schema v[0-9]+\)$'
